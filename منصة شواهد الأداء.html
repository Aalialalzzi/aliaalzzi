<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>منصة شواهد الأداء</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: a control-room shell; top bar + segmented views; dashboards built from gauges, radar and an evidence heatmap */
:root{
  --bg:#081520;--panel:#0f2230;--panel2:#142c3c;--line:#1f3d4e;--ink:#e4f0f2;--muted:#86a3ab;
  --a1:#2b86cc;--a2:#3db57c;--grad:linear-gradient(100deg,#2b86cc,#34a3a0 55%,#3db57c);
  --good:#4fd08a;--warn:#f1b24a;--bad:#f2706a;--glow:0 0 0 1px rgba(61,181,124,.25),0 18px 50px -20px rgba(43,134,204,.55);
  --display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;--body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eaf1f4;--panel:#ffffff;--panel2:#f3f8fa;--line:#d3e1e6;--ink:#0c2430;--muted:#567380;
  --glow:0 0 0 1px rgba(43,134,204,.15),0 18px 40px -24px rgba(12,36,48,.35);color-scheme:light}}
:root[data-theme="light"]{--bg:#eaf1f4;--panel:#ffffff;--panel2:#f3f8fa;--line:#d3e1e6;--ink:#0c2430;--muted:#567380;
  --glow:0 0 0 1px rgba(43,134,204,.15),0 18px 40px -24px rgba(12,36,48,.35);color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;direction:rtl;min-height:100vh;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(43,134,204,.18),transparent 60%),radial-gradient(700px 420px at 0% 0%,rgba(61,181,124,.12),transparent 60%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:var(--glow)}
.mark svg{width:22px;height:22px}
.logo{background:#ffffff;border-radius:12px;padding:5px 8px;height:48px;display:grid;place-items:center;box-shadow:var(--glow)}
.logo img{height:38px;width:auto;display:block}
.foot{border-top:1px solid var(--line);margin-top:10px}
.foot .wrap{padding-block:26px calc(26px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;justify-items:center;text-align:center}
.foot .sc{font-family:var(--display);font-size:clamp(22px,4vw,30px);font-weight:800}
.foot .mg{font-size:16px;color:var(--ink)}
.brand b{font-family:var(--display);font-weight:700;font-size:17px;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--a2);box-shadow:0 0 8px var(--a2)}
main.wrap{padding-block:26px 64px;display:grid;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:700}
h1{font-size:clamp(28px,5vw,48px);line-height:1.15;font-weight:800}
h2{font-size:22px}h3{font-size:16px;font-weight:500}
.muted{color:var(--muted)}
.gtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}
button{font:inherit;cursor:pointer;border-radius:12px;padding:10px 18px;border:0;background:var(--grad);color:#fff;font-weight:600;transition:transform .15s,filter .15s}
button:hover{filter:brightness(1.08)}button:active{transform:scale(.98)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.ghost:hover{border-color:var(--a1)}
button.sm{padding:6px 12px;font-size:13px;border-radius:10px}
button:focus-visible,.tile:focus-visible,.seg button:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 13px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--a2);box-shadow:0 0 0 3px rgba(61,181,124,.18)}
label{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
form{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.err{color:var(--bad);font-size:13px;min-height:1em;margin:0}.ok{color:var(--good);font-size:13px;margin:0}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* home */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;padding-block:18px}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.hero p{font-size:17px;color:var(--muted);max-width:52ch}
.portals{display:grid;gap:14px}
.portal{all:unset;cursor:pointer;position:relative;overflow:hidden;border-radius:20px;padding:24px;background:var(--panel);border:1px solid var(--line);display:grid;gap:6px;transition:transform .2s,box-shadow .2s,border-color .2s}
.portal:hover,.portal:focus-visible{transform:translateY(-3px);box-shadow:var(--glow);border-color:transparent}
.portal::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:var(--grad);opacity:.18;filter:blur(10px)}
.portal b{font-family:var(--display);font-size:22px}
.portal .go{position:absolute;left:22px;top:22px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-size:18px}
.dots{display:grid;grid-template-columns:repeat(11,1fr);gap:6px;margin-top:8px}
.dots span{aspect-ratio:1;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}
.dots span.on{background:var(--grad);border-color:transparent}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}

/* segmented */
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{background:transparent;color:var(--muted);padding:8px 16px;border-radius:10px;font-weight:500}
.seg button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

/* kpis & gauges */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.kpi{display:flex;align-items:center;gap:16px}
.kpi .v{font-size:30px;font-weight:700;line-height:1}
.ring{flex:none}
.ring circle{fill:none}
.ring .tr{stroke:var(--line)}
.ring .pr{stroke:url(#g);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1)}
.ring text{fill:var(--ink);font-family:var(--display);font-weight:700}
.dash{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
@media(max-width:900px){.dash{grid-template-columns:1fr}}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:end;height:190px;padding-top:10px}
.bars .b{display:grid;gap:6px;justify-items:center;height:100%;align-content:end}
.bars .col{width:100%;max-width:56px;border-radius:10px 10px 4px 4px;background:var(--grad);min-height:4px;transition:height .8s cubic-bezier(.2,.7,.2,1)}
.bars .col.z{background:var(--line)}
.bars small{font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
.split{display:grid;gap:12px}
.split .ln{display:grid;gap:6px}
.track{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.track i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .8s}

/* heatmap */
.hm{overflow-x:auto}
.hm table{border-collapse:separate;border-spacing:4px;min-width:640px;width:100%}
.hm th{font-size:11px;color:var(--muted);font-weight:500;padding:2px 4px;text-align:center}
.hm th.nm{text-align:right;min-width:150px}
.hm td.nm{font-size:13px;white-space:nowrap;padding-inline-end:8px;cursor:pointer}
.hm td.nm:hover{color:var(--a2)}
.cell{height:30px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;font-family:var(--display);cursor:default}
.cell.ev{background:rgba(43,134,204,.45);border-color:transparent;cursor:pointer}
.cell.s1{background:#c4504a}.cell.s2{background:#d98a3a}.cell.s3{background:#2b86cc}.cell.s4{background:#2f9e9a}.cell.s5{background:#3db57c}
.cell:hover{outline:2px solid var(--ink)}

/* teacher cards */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tc{all:unset;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;transition:transform .2s,box-shadow .2s}
.tc:hover,.tc:focus-visible{transform:translateY(-2px);box-shadow:var(--glow)}
.tc .hd{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--panel2);border:1px solid var(--line);flex:none}
.tc .nm{font-weight:600;line-height:1.3}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{color:var(--good);background:rgba(79,208,138,.12)}.p-warn{color:var(--warn);background:rgba(241,178,74,.13)}.p-bad{color:var(--bad);background:rgba(242,112,106,.12)}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters input{width:220px}.filters select{width:auto}

/* teacher portal */
.me{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center}
@media(max-width:720px){.me{grid-template-columns:1fr;justify-items:start}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{all:unset;cursor:pointer;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;align-content:start;min-height:130px;transition:transform .2s,border-color .2s,box-shadow .2s}
.tile:hover{transform:translateY(-2px);border-color:var(--a1)}
.tile .n{font-family:var(--display);font-size:13px;color:var(--muted)}
.tile b{font-weight:600;line-height:1.4}
.tile .ft{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.tile.done{border-color:transparent;box-shadow:inset 0 0 0 1px rgba(61,181,124,.5)}
.tile.done::before{content:"";position:absolute;inset:0 0 auto;height:3px;border-radius:16px 16px 0 0;background:var(--grad)}
.w{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:1px 8px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(3,10,16,.6);backdrop-filter:blur(3px);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(460px,100%);height:100%;background:var(--panel);border-inline-end:1px solid var(--line);padding:24px max(20px,env(safe-area-inset-left,0px)) 24px 20px;padding-top:calc(24px + env(safe-area-inset-top,0px));display:grid;gap:16px;align-content:start;overflow:auto;animation:slide .28s cubic-bezier(.2,.7,.2,1)}
.scrim{justify-content:flex-start}
@keyframes slide{from{transform:translateX(-30px);opacity:0}}
.req{margin:0;padding-inline-start:18px;color:var(--muted);font-size:14px;display:grid;gap:4px}
.link{color:var(--a2);word-break:break-all}

/* evaluation */
.ev{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
@media(max-width:980px){.ev{grid-template-columns:1fr}}
.side{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));display:grid;gap:14px}
@media(max-width:980px){.side{position:static}}
.erow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
@media(max-width:600px){.erow{grid-template-columns:1fr}}
.erow .t{display:grid;gap:4px}
.scale{display:flex;gap:6px}
.scale label{display:block}
.scale input{position:absolute;opacity:0;width:1px;height:1px}
.scale span{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-family:var(--display);font-weight:700;cursor:pointer;transition:all .15s}
.scale span:hover{border-color:var(--a1)}
.scale input:checked+span{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 18px -6px rgba(61,181,124,.7)}
.scale input:focus-visible+span{outline:2px solid var(--a2)}
.radar text{fill:var(--muted);font-size:9.5px;font-family:var(--body)}
.radar .gr{fill:none;stroke:var(--line)}
.radar .ar{fill:rgba(61,181,124,.25);stroke:var(--a2);stroke-width:2;transition:all .4s}
.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.lv div{padding:6px 2px;border-radius:9px;text-align:center;font-size:11px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);line-height:1.4}
.lv div b{display:block;font-family:var(--display);font-size:16px;color:var(--ink)}
.lv div.on{background:var(--grad);border-color:transparent;color:#fff}.lv div.on b{color:#fff}

/* reports */
.rform{display:grid;gap:12px}
.pv{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel2);padding:12px;max-height:75vh}
.rlist{display:grid;gap:8px}
.ritem{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.sheet{width:794px;min-height:1123px;background:#ffffff;color:#1b2b2a;display:flex;flex-direction:column;font-family:var(--body);direction:rtl;margin:0 auto}
.sheet .hd{position:relative}.sheet .hd img,.sheet .ft img{width:100%;display:block}
.sheet .ttl{position:absolute;left:26.5%;width:47.2%;top:74%;height:25%;display:grid;place-items:center;color:#ffffff;font-weight:700;font-size:19px;text-align:center;padding:0 10px;line-height:1.3}
.sheet .sch{position:absolute;left:4%;width:44%;top:30%;color:#ffffff;font-size:14px;text-align:center;line-height:1.8}
.sheet .bd{flex:1;padding:26px 46px;display:grid;gap:16px;align-content:start}
.sheet table{min-width:0;border:1px solid #c9d8d6}
.sheet th,.sheet td{border:1px solid #c9d8d6;padding:7px 10px;font-size:14px;color:#1b2b2a}
.sheet th{background:#e8f1f0;color:#0b3a46;width:22%;font-weight:700}
.sheet h4{margin:0 0 6px;display:inline-block;background:#0b3a46;color:#ffffff;padding:3px 14px;border-radius:6px;font-size:15px}
.sheet p{margin:0;font-size:14px;white-space:pre-wrap;line-height:1.9}
.sheet .pics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .pics img{width:100%;height:210px;object-fit:cover;border-radius:8px;border:1px solid #c9d8d6}
.sheet .sign{display:flex;justify-content:space-between;margin-top:18px;font-size:14px;padding:0 10px}
.sheet .sign b{color:#0b3a46}

.rv{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.rv button{padding:5px 12px;font-size:12px;border-radius:9px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.rv button.ok-on{background:rgba(79,208,138,.16);color:var(--good);border-color:var(--good)}
.rv button.no-on{background:rgba(242,112,106,.14);color:var(--bad);border-color:var(--bad)}
.rv input{flex:1;min-width:180px;padding:6px 10px;font-size:13px;border-radius:9px}
.note{border-radius:12px;padding:12px 14px;font-size:14px;border:1px solid var(--line);background:var(--panel2)}
.note.no{border-color:var(--bad);background:rgba(242,112,106,.08)}.note.ok{border-color:var(--good);background:rgba(79,208,138,.08)}
.note b{display:block;font-size:12px;margin-bottom:2px}
.tile .nt{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;padding:40px;color:var(--muted)}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:.0001;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const ITEMS=[

 {k:"i2",t:"التفاعل مع المجتمع المحلي",s:"المجتمع",w:10,r:["المبادرات والبرامج المجتمعية","المشاركة في الفعاليات والأعمال التطوعية","الشراكات مع جهات المجتمع"]},
 {k:"i3",t:"التفاعل مع أولياء الأمور",s:"الأسرة",w:10,r:["سجل التواصل مع أولياء الأمور","حضور مجالس الآباء واللقاءات","تقارير مستوى الطلاب المرسلة"]},

 {k:"i5",t:"تحسين نتائج المتعلمين",s:"النتائج",w:10,r:["الخطط العلاجية والإثرائية","مقارنة نتائج الطلاب قبل وبعد","تكريم المتميزين ومتابعة المتعثرين"]},
 {k:"i6",t:"إعداد وتنفيذ خطة التعلم",s:"الخطة",w:10,r:["توزيع المنهج","إعداد الدروس","الواجبات والمهام المرتبطة بالخطة"]},
 {k:"i7",t:"توظيف تقنيات ووسائل التعلم المناسبة",s:"التقنيات",w:10,r:["استخدام منصة مدرستي والفصول الافتراضية","العروض والوسائل التعليمية"]},
 {k:"i8",t:"تهيئة بيئة تعليمية",s:"البيئة",w:5,r:["مراعاة الفروق الفردية","أساليب التحفيز المعنوي والمادي","تهيئة الصف ولوحاته"]},

const LEVELS=[{n:1,r:"أقل من 60%",l:"غير مرضٍ"},{n:2,r:"60–69%",l:"بحاجة إلى تطوير"},{n:3,r:"70–79%",l:"وافق التوقعات"},{n:4,r:"80–89%",l:"تخطى التوقعات"},{n:5,r:"90–100%",l:"مثالي"}];
const DEFAULT_PASS="1448";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app=$("#app"),hdr=$("#hdr");
let db=null,teachers=[],state={view:"home"},adminPass=DEFAULT_PASS,loaded=false;

function calc(scores){scores=scores||{};let sum=0,n=0;ITEMS.forEach(it=>{const s=+scores[it.k];if(s>=1&&s<=5){sum+=s*it.w;n++}});
  const pct=sum*100/500,lvl=pct>=90?5:pct>=80?4:pct>=70?3:pct>=60?2:1;return{sum,pct,lvl,n,complete:n===ITEMS.length}}
const evCount=t=>ITEMS.filter(it=>(t.evidence||{})[it.k]).length;
function status(t){const c=calc(t.scores);if(c.complete)return{c:"p-good",t:"تم التقييم"};if(evCount(t)===ITEMS.length)return{c:"p-warn",t:"بانتظار التقييم"};return{c:"p-bad",t:"شواهد ناقصة"}}
const isUrl=u=>/^https?:\/\/\S+$/i.test(u.trim());
const initials=n=>String(n||"؟").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join(" ");

function ring(pct,size=92,sw=9,label){const r=(size-sw)/2,C=2*Math.PI*r,off=C*(1-Math.max(0,Math.min(100,pct))/100);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${Math.round(pct)}%"><g transform="rotate(-90 ${size/2} ${size/2})"><circle class="tr" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${sw}"/><circle class="pr" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${sw}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${off}"/></g><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="${size/4.6}">${label??Math.round(pct)+"%"}</text></svg>`}
function animateRings(){requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".ring .pr[data-off]").forEach(c=>c.style.strokeDashoffset=c.dataset.off)))}
function radar(scores,size=320){const cx=size/2,cy=size/2,R=size/2-58,N=ITEMS.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(a)*R*v,cy+Math.sin(a)*R*v]};
  let g="";[.2,.4,.6,.8,1].forEach(v=>{g+=`<polygon class="gr" points="${ITEMS.map((_,i)=>pt(i,v).join(",")).join(" ")}"/>`});
  ITEMS.forEach((_,i)=>{const[x,y]=pt(i,1);g+=`<line class="gr" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`});
  const poly=ITEMS.map((it,i)=>pt(i,(+scores[it.k]||0)/5).join(",")).join(" ");
  const lb=ITEMS.map((it,i)=>{const[x,y]=pt(i,1.2);return`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central">${it.s}</text>`}).join("");
  return `<svg class="radar" viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px;display:block;margin:auto" role="img" aria-label="مخطط البنود">${g}<polygon class="ar" points="${poly}"/>${lb}</svg>`}

function setHdr(html){hdr.innerHTML=html;hdr.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go))}
function go(view,extra={}){state={view,...extra};render();window.scrollTo(0,0)}
function render(){
  const v=state.view;
  if(!db&&v!=="home"){app.innerHTML=`<div class="card empty">المنصة تحتاج تسجيل الدخول إلى Claude لحفظ البيانات ومشاركتها.</div>`;return}
  ({home:viewHome,tLogin:viewTLogin,teacher:viewTeacher,mLogin:viewMLogin,manager:viewManager,eval:viewEval}[v]||viewHome)();
  animateRings();
}

function closeDrawer(){state.drawer=null;document.querySelector(".scrim")?.remove()}
function openDrawer(t,k){
  document.querySelector(".scrim")?.remove();state.drawer=k;
  const it=ITEMS.find(x=>x.k===k),i=ITEMS.indexOf(it),u=(t.evidence||{})[k]||"",rv=(t.review||{})[k]||{};
  const sc=document.createElement("div");sc.className="scrim";
  sc.innerHTML=`<aside class="drawer" role="dialog" aria-label="${it.t}">
    <div class="row between"><span class="eyebrow num">البند ${i+1} من ${ITEMS.length} · الوزن ${it.w}%</span><button class="ghost sm" id="dx">إغلاق</button></div>
    <h2>${it.t}</h2>
    ${rv.s||rv.note?`<div class="note ${rv.s||""}"><b>${rv.s==="ok"?"اعتمد المدير هذا الشاهد":rv.s==="no"?"رفض المدير هذا الشاهد، حدّث الرابط":"ملاحظة المدير"}</b>${esc(rv.note||"")}</div>`:""}
    <div><span class="eyebrow">الشواهد المقترحة</span><ul class="req">${it.r.map(x=>`<li>${x}</li>`).join("")}</ul></div>
    <label>رابط مجلد Google Drive<input id="du" dir="ltr" placeholder="https://drive.google.com/..." value="${esc(u)}"></label>
    <p class="err" id="dm"></p>
    <div class="row"><button id="ds">${u?"تحديث الرابط":"حفظ الشاهد"}</button>${u?`<a class="link" href="${esc(u)}" target="_blank" rel="noopener">فتح الشاهد ↗</a>`:""}</div>
    <div class="row between" style="margin-top:8px">${i>0?`<button class="ghost sm" data-nav="${ITEMS[i-1].k}">→ السابق</button>`:"<span></span>"}${i<ITEMS.length-1?`<button class="ghost sm" data-nav="${ITEMS[i+1].k}">التالي ←</button>`:""}</div>
  </aside>`;
  document.body.appendChild(sc);
  sc.onclick=e=>{if(e.target===sc)closeDrawer()};$("#dx").onclick=closeDrawer;
  sc.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>openDrawer(t,b.dataset.nav));
  document.onkeydown=e=>{if(e.key==="Escape")closeDrawer()};
  $("#ds").onclick=async()=>{const v=$("#du").value.trim();if(v&&!isUrl(v)){$("#dm").textContent="الصق رابطاً كاملاً يبدأ بـ https://";return}
    $("#ds").disabled=true;try{await db.collection("teachers").doc(t.cid).update({evidence:{...(t.evidence||{}),[k]:v},review:{...(t.review||{}),[k]:{s:"",note:rv.s==="no"?"":(rv.note||"")}}});$("#dm").className="ok";$("#dm").textContent="تم الحفظ."}
    catch(e){$("#dm").className="err";$("#dm").textContent="تعذّر الحفظ، حاول مرة أخرى.";$("#ds").disabled=false}};
}

      ${f.map(t=>{const c=calc(t.scores);return`<tr><td class="nm" data-ev="${esc(t.cid)}">${esc(t.name)}</td>${ITEMS.map(it=>{const u=(t.evidence||{})[it.k],s=+(t.scores||{})[it.k];const cls=`cell ${s?"s"+s:u?"ev":""}`,ti=`${it.t}${u?" · اضغط لفتح الشاهد":" · لا يوجد شاهد"}`;return`<td>${u?`<a class="${cls}" href="${esc(u)}" target="_blank" rel="noopener" title="${ti}" style="text-decoration:none">${s||""}</a>`:`<div class="${cls}" title="${ti}">${s||""}</div>`}</td>`}).join("")}<td class="num" style="text-align:center;font-weight:700">${c.complete?Math.round(c.pct)+"%":"—"}</td></tr>`}).join("")}
      </tbody></table></div><p class="muted" style="font-size:12px;margin:10px 0 0">اضغط على خلية لفتح الشاهد، أو على اسم المعلم لفتح صفحة تقييمه.</p></div>`;
  }else if(mt==="list"){
    mb.innerHTML=f.length?`<div class="tgrid">${f.map(tcard).join("")}</div>`:`<div class="card empty">لا نتائج مطابقة.</div>`;
  }else{
    mb.innerHTML=`<div class="card" style="max-width:560px"><form id="f3"><h3>تغيير كلمة مرور المدير</h3>
      <div class="grid2"><label>كلمة المرور الحالية<input id="p0" type="password" required></label><label>كلمة المرور الجديدة<input id="p1" type="password" minlength="4" required></label></div>
      <p class="err" id="e3"></p><div><button>حفظ</button></div></form></div>`;
    $("#f3").onsubmit=async e=>{e.preventDefault();if($("#p0").value!==adminPass){$("#e3").textContent="كلمة المرور الحالية غير صحيحة.";return}
      try{await db.doc("settings/admin").set({pass:$("#p1").value});adminPass=$("#p1").value;$("#e3").className="ok";$("#e3").textContent="تم تغيير كلمة المرور."}catch(err){$("#e3").textContent="تعذّر الحفظ."}};
  }
  mb.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>go("eval",{cid:b.dataset.ev,back:{stage:state.stage,q:state.q,mt:state.mt}}));
}
function tcard(t){const c=calc(t.scores),s=status(t),e=evCount(t);return`<button class="tc" data-ev="${esc(t.cid)}">
  <div class="hd"><div class="av">${esc(initials(t.name))}</div><div style="min-width:0"><div class="nm">${esc(t.name)}</div><div class="muted" style="font-size:12px">${esc(t.subject)} · ${esc(t.stage)}</div></div></div>
  <div class="row between">${ring(c.complete?c.pct:e/ITEMS.length*100,64,6,c.complete?Math.round(c.pct)+"%":e+"/"+ITEMS.length)}<div style="display:grid;gap:6px;justify-items:end"><span class="pill ${s.c}">${s.t}</span><span class="muted" style="font-size:12px">${c.complete?LEVELS[c.lvl-1].l:"الشواهد "+e+" من "+ITEMS.length}</span></div></div></button>`}

function viewEval(){
  setHdr(`<span class="chip"><i></i>المدير</span><button class="ghost sm" id="bk">رجوع للوحة</button>`);
  $("#bk").onclick=()=>go("manager",state.back||{stage:"",q:"",mt:"overview"});
  const t=teachers.find(x=>x.cid===state.cid);if(!t){app.innerHTML=`<div class="card empty">لم يُعثر على المعلم.</div>`;return}
  const draft=state.draft||(state.draft={...(t.scores||{})});
  app.innerHTML=`
  <section class="card me fade" style="grid-template-columns:auto 1fr"><div class="av" style="width:64px;height:64px;font-size:20px">${esc(initials(t.name))}</div>
    <div style="display:grid;gap:6px;min-width:0"><span class="eyebrow">تقييم الأداء الوظيفي</span><h2>${esc(t.name)}</h2>
    <div class="row"><span class="chip">${esc(t.subject)}</span><span class="chip">المرحلة ${esc(t.stage)}</span><span class="chip num">${esc(t.cid)}</span>${t.evaluatedAt?`<span class="chip">آخر تقييم ${new Date(t.evaluatedAt).toLocaleDateString("ar-SA-u-ca-islamic-umalqura")}</span>`:""}${(t.reports||[]).length?`<span class="chip">${t.reports.length} تقرير</span>`:""}</div></div>
    <div class="row" style="grid-column:1/-1"><button class="ghost sm" id="goFiles">عرض ملف الشواهد والتقارير</button><button class="ghost sm" id="delT" style="color:var(--bad);border-color:var(--bad)">حذف المعلم</button><span class="err" id="delM"></span></div></section>
  <section class="card" id="files" style="display:grid;gap:14px"><div class="row between"><h3>ملف الشواهد</h3><span class="muted num" style="font-size:12px">${evCount(t)} من ${ITEMS.length} مرفوع</span></div>
    <div class="rlist">${ITEMS.map((it,i)=>{const u=(t.evidence||{})[it.k],rv=(t.review||{})[it.k]||{};return`<div class="ritem"><div><span class="muted num">${i+1}.</span> <b>${it.t}</b></div><div class="row">${rv.s==="ok"?`<span class="pill p-good">معتمد</span>`:rv.s==="no"?`<span class="pill p-bad">مرفوض</span>`:""}${u?`<a class="link" href="${esc(u)}" target="_blank" rel="noopener">فتح الشاهد ↗</a>`:`<span class="pill p-bad">لم يُرفع</span>`}</div></div>`}).join("")}</div>
    <h3>تقارير المعلم</h3>
    ${(t.reports||[]).length?`<div class="rlist">${t.reports.map((r,i)=>`<div class="ritem"><div><b>${esc(r.prog)}</b> <span class="muted num">· ${esc(r.date)}</span>${r.item?`<div class="muted" style="font-size:12px">${esc(r.item)}</div>`:""}</div><div class="row"><button class="ghost sm" data-mprev="${i}">معاينة</button><button class="ghost sm" data-mpdf="${i}">تحميل PDF</button></div></div>`).join("")}</div><p class="muted" id="mrMsg" style="margin:0;font-size:13px"></p><div class="pv" id="mPv" hidden></div>`:`<p class="muted" style="margin:0">لم يُنشئ المعلم تقارير بعد.</p>`}
  </section>
  <div class="ev">
    <div style="display:grid;gap:10px">${ITEMS.map((it,i)=>{const u=(t.evidence||{})[it.k];return`<div class="erow">
      <div class="t"><span class="eyebrow num">البند ${i+1} · الوزن ${it.w}%</span><b>${it.t}</b>
        <div class="row" style="font-size:13px">${u?`<a class="link" href="${esc(u)}" target="_blank" rel="noopener">فتح الشاهد ↗</a>`:`<span class="pill p-bad">لم يُرفع شاهد</span>`}<span class="muted num" id="w_${it.k}">${draft[it.k]?"الموزون "+draft[it.k]*it.w:""}</span></div>
        ${u?`<div class="rv" data-rv="${it.k}"><button type="button" data-s="ok" class="${((t.review||{})[it.k]||{}).s==="ok"?"ok-on":""}">✓ اعتماد</button><button type="button" data-s="no" class="${((t.review||{})[it.k]||{}).s==="no"?"no-on":""}">✕ رفض</button><input placeholder="ملاحظة للمعلم (اختياري)" value="${esc(((t.review||{})[it.k]||{}).note||"")}"><button type="button" data-s="note">إرسال الملاحظة</button><span class="muted" style="font-size:12px" data-m></span></div>`:""}</div>
      <div class="scale" role="radiogroup" aria-label="${it.t}">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="${it.k}" value="${n}" ${+draft[it.k]===n?"checked":""}><span>${n}</span></label>`).join("")}</div></div>`}).join("")}</div>
    <aside class="side"><div class="card" style="display:grid;gap:14px;justify-items:center" id="live"></div>
      <div class="card" id="rad"></div></aside>
  </div>`;
  const upd=()=>{const c=calc(draft);
    $("#live").innerHTML=`<span class="eyebrow">النتيجة الحية</span>${ring(c.pct,150,13,c.n?c.pct.toFixed(1)+"%":"—")}
      <div class="row" style="justify-content:center;gap:18px"><div style="text-align:center"><div class="num" style="font-size:20px;font-weight:700">${c.sum}<span class="muted" style="font-size:12px">/500</span></div><span class="muted" style="font-size:12px">الموزون</span></div>
      <div style="text-align:center"><div class="num" style="font-size:20px;font-weight:700">${c.n}<span class="muted" style="font-size:12px">/11</span></div><span class="muted" style="font-size:12px">بنود مقيّمة</span></div></div>
      <div class="lv" style="width:100%">${LEVELS.map(l=>`<div class="${c.n&&c.lvl===l.n?"on":""}"><b>${l.n}</b>${l.l}</div>`).join("")}</div>
      <p class="err" id="e4"></p><button id="sv" style="width:100%">حفظ التقييم</button>`;
    $("#rad").innerHTML=`<h3 style="margin-bottom:6px">بصمة الأداء</h3>${radar(draft)}`;
    animateRings();
    $("#sv").onclick=async()=>{const c=calc(draft);if(!c.complete){$("#e4").textContent="قيّم جميع البنود الأحد عشر قبل الحفظ.";return}
      $("#sv").disabled=true;try{await db.collection("teachers").doc(t.cid).update({scores:{...draft},evaluatedAt:Date.now()});state.saved=true;setTimeout(()=>{const m=$("#e4");if(m){m.className="ok";m.textContent="تم حفظ التقييم."}},50)}
      catch(e){$("#e4").textContent="تعذّر الحفظ.";$("#sv").disabled=false}}};
  upd();
  $("#goFiles").onclick=()=>$("#files").scrollIntoView({behavior:"smooth"});
  app.querySelectorAll("[data-mprev]").forEach(b=>b.onclick=()=>{const pv=$("#mPv");pv.hidden=false;pv.innerHTML=sheetHTML(t.reports[+b.dataset.mprev],[])});
  app.querySelectorAll("[data-mpdf]").forEach(b=>b.onclick=()=>makePdf(t.reports[+b.dataset.mpdf],[],$("#mrMsg")));
  $("#delT").onclick=async()=>{const b=$("#delT");
    if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="تأكيد: حذف المعلم وكل بياناته نهائياً";$("#delM").textContent="اضغط مرة أخرى للتأكيد";setTimeout(()=>{if(b.isConnected){b.dataset.sure="";b.textContent="حذف المعلم";$("#delM").textContent=""}},5000);return}
    b.disabled=true;try{await db.collection("teachers").doc(t.cid).delete();go("manager",state.back||{stage:"",q:"",mt:"overview"})}catch(e){$("#delM").textContent="تعذّر الحذف.";b.disabled=false}};
  const rev={...(t.review||{})};
  app.querySelectorAll("[data-rv]").forEach(box=>{const k=box.dataset.rv,inp=box.querySelector("input"),m=box.querySelector("[data-m]");
    box.querySelectorAll("button").forEach(b=>b.onclick=async()=>{const cur=rev[k]||{};let s=cur.s||"";if(b.dataset.s!=="note")s=cur.s===b.dataset.s?"":b.dataset.s;
      rev[k]={s,note:inp.value.trim(),at:Date.now()};m.textContent="جارٍ الحفظ…";
      try{await db.collection("teachers").doc(t.cid).update({review:{...rev}});t.review={...rev};
        box.querySelector('[data-s="ok"]').className=s==="ok"?"ok-on":"";box.querySelector('[data-s="no"]').className=s==="no"?"no-on":"";m.textContent="وصل للمعلم ✓"}
      catch(e){m.textContent="تعذّر الحفظ"}})});
  app.querySelectorAll(".scale input").forEach(r=>r.onchange=()=>{draft[r.name]=+r.value;const it=ITEMS.find(x=>x.k===r.name);$("#w_"+r.name).textContent="الموزون "+draft[r.name]*it.w;upd()});
}

let repImgs=[];
const RF=["prog","date","tname","school","place","target","count","item","goals","desc"];
function readForm(){const o={};RF.forEach(k=>o[k]=$("#r_"+k).value.trim());return o}
function fillForm(r){RF.forEach(k=>{if($("#r_"+k))$("#r_"+k).value=r[k]||""})}
function sheetHTML(r,imgs){
  const rows=[["اسم البرنامج",r.prog],["التاريخ",r.date],["المنفذ",r.tname],["مكان التنفيذ",r.place],["الفئة المستهدفة",r.target],["عدد المستفيدين",r.count],["البند المرتبط",r.item]].filter(x=>x[1]);
  return `<div class="sheet"><div class="hd"><img src="${HDR}" alt=""><div class="sch">${r.school?"إدارة تعليم جازان<br>"+esc(r.school):""}</div><div class="ttl">${esc(r.prog||"اسم البرنامج")}</div></div>
  <div class="bd"><table><tbody>${rows.map(x=>`<tr><th>${x[0]}</th><td>${esc(x[1])}</td></tr>`).join("")}</tbody></table>
  ${r.goals?`<div><h4>الأهداف</h4><p>${esc(r.goals)}</p></div>`:""}
  ${r.desc?`<div><h4>وصف البرنامج وآلية التنفيذ</h4><p>${esc(r.desc)}</p></div>`:""}
  ${imgs.length?`<div><h4>الشواهد</h4><div class="pics">${imgs.map(u=>`<img src="${u}" alt="">`).join("")}</div></div>`:""}
  <div class="sign"><div>المعلم: <b>${esc(r.tname)}</b><br>التوقيع: ............</div><div>مدير المدرسة: <b>محمد يحيى مفرح</b><br>التوقيع: ............</div></div></div>
  <div class="ft"><img src="${FTR}" alt=""></div></div>`;
}
function readImgs(files){return Promise.all([...files].slice(0,4).map(f=>new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),sc=Math.min(1,1000/im.width);c.width=im.width*sc;c.height=im.height*sc;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.85))};im.src=fr.result};fr.readAsDataURL(f)})))}
async function makePdf(r,imgs,msg){
  msg.className="muted";msg.textContent="جارٍ إنشاء الملف…";
  const holder=document.createElement("div");holder.style.cssText="position:fixed;left:-10000px;top:0";holder.innerHTML=sheetHTML(r,imgs);document.body.appendChild(holder);
  try{
    await document.fonts.ready;await Promise.all([...holder.querySelectorAll("img")].map(i=>i.complete?0:new Promise(z=>{i.onload=i.onerror=z})));
    const cv=await html2canvas(holder.firstChild,{scale:2,backgroundColor:"#ffffff"});
    const pdf=new jspdf.jsPDF({unit:"mm",format:"a4"});const W=210,H=cv.height*W/cv.width;
    if(H<=297.5)pdf.addImage(cv.toDataURL("image/jpeg",.92),"JPEG",0,0,W,H);
    else{const ph=Math.floor(cv.width*297/210);for(let y=0,p=0;y<cv.height;y+=ph,p++){const c=document.createElement("canvas");c.width=cv.width;c.height=Math.min(ph,cv.height-y);c.getContext("2d").fillStyle="#fff";c.getContext("2d").fillRect(0,0,c.width,c.height);c.getContext("2d").drawImage(cv,0,-y);if(p)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",.92),"JPEG",0,0,W,c.height*W/c.width)}}
    const dl=await window.claude?.use("downloads").catch(()=>null);
    if(!dl){msg.className="err";msg.textContent="التحميل غير متاح في هذا العرض.";return}
    await dl.save({filename:("تقرير "+(r.prog||"برنامج")).replace(/[\\/:*?"<>|]/g,"-")+".pdf",data:pdf.output("blob")});
    msg.className="ok";msg.textContent="تم تجهيز الملف. افتحه واطبعه من جهازك.";
  }catch(e){msg.className="err";msg.textContent=e&&e.code==="declined"?"أُلغي التحميل.":"تعذّر إنشاء الملف، حاول مرة أخرى."}
  finally{holder.remove()}
}

function bindReports(t){
  const msg=$("#r_msg");
  $("#r_imgs").onchange=async e=>{repImgs=await readImgs(e.target.files)};
  $("#r_prev").onclick=()=>{const pv=$("#r_pv");pv.hidden=false;pv.innerHTML=sheetHTML(readForm(),repImgs)};
  $("#r_pdf").onclick=async()=>{const r=readForm();if(!r.prog||!r.date){msg.className="err";msg.textContent="اكتب اسم البرنامج والتاريخ.";return}
    const list=[...(t.reports||[])];const i=list.findIndex(x=>x.prog===r.prog&&x.date===r.date);
    if(i>=0)list[i]={...r,at:Date.now()};else list.push({...r,at:Date.now()});
    await makePdf(r,repImgs,msg);
    try{await db.collection("teachers").doc(t.cid).update({reports:list,school:r.school})}catch(e){}};
  app.querySelectorAll("[data-redit]").forEach(b=>b.onclick=()=>{fillForm(t.reports[+b.dataset.redit]);$("#rf").scrollIntoView({behavior:"smooth"})});
  app.querySelectorAll("[data-rpdf]").forEach(b=>b.onclick=()=>makePdf(t.reports[+b.dataset.rpdf],[],msg));
  app.querySelectorAll("[data-rdel]").forEach(b=>b.onclick=async()=>{if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="تأكيد الحذف";return}
    const list=[...t.reports];list.splice(+b.dataset.rdel,1);try{await db.collection("teachers").doc(t.cid).update({reports:list})}catch(e){}});
}

render();
(async()=>{
  db=await window.claude?.use("db").catch(()=>null);
  if(!db){render();return}
  try{const s=await db.doc("settings/admin").get();if(s.exists&&s.data().pass)adminPass=s.data().pass}catch(e){}
  db.collection("teachers").onSnapshot(snap=>{
    teachers=snap.docs.map(d=>({cid:d.id,...d.data()}));loaded=true;
    const v=state.view;
    if(v==="manager"||v==="home")render();
    else if(v==="teacher"){const f=document.activeElement;const typing=f&&f.closest&&f.closest("#rf");if(!typing)render()}
    else if(v==="eval"&&!state.draft)render();
  },()=>{});
  if(state.view==="home")render();
})();
</script>
